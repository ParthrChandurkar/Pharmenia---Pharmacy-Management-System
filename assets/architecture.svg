<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Pharmenia Pharmacy Management System Architecture</title>
  <desc id="desc">Architecture diagram for the Pharmenia desktop pharmacy management system showing the Tkinter admin UI, Python application helpers, MySQL stored procedures, normalized database tables, reporting views, inventory ledger, and PDF invoice output.</desc>

